name: verify
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: contract immutability
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
          else
            # Every commit in the push must be checked, not only the tip: a push
            # of N commits where an early one edits a contract slipped through
            # when the baseline was HEAD~1. github.event.before is the branch
            # tip before this push; it is all-zeros for a newly created branch.
            base="${{ github.event.before }}"
            case "$base" in ""|0000000000000000000000000000000000000000) base="HEAD~1" ;; esac
          fi
          bash tools/check-immutability.sh "$base"
      - name: verify
        run: node tools/verify.mjs
